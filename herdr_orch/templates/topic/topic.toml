# Only what differs from the defaults. Every key is optional.

# Repo roots this Topic manages (shell-style patterns, ~ allowed).
# match = ["~/projects/acme/*"]

# Seated agents: model, base ref for new worktrees, env exported in the pane first.
# model = "sonnet"
# base = "origin/main"
# [env]
# CLAUDE_CONFIG_DIR = "~/.claude-acme"

# Kind of the seated agents (default "claude") and native args passed after `--`. `model` only
# works with kinds that take --model (claude, codex). The Orchestrator is always Claude.
# [agent]
# kind = "codex"
# args = ["--full-auto"]

# Command that sends you a push: gets "<title>\n<body>" on stdin. Default: none.
# notify_command = ["ntfy-send"]

# GitHub Integration: opt in with a [github] table (empty is fine). It owns PR following, the branch
# ledger, the deploy gate and PR-gated `release`/`validated`. Absent: no gh call anywhere, `validated`
# needs only --evidence, the Orchestrator runs `release`, and nothing is released automatically.
# [github]
# GitHub identities by role, so plugin code never spends your own login's rate limit. Each is a
# command that prints a token (~ expanded). read_token_cmd: every poll and lookup (watch, release,
# deploy check). write_token_cmd: exported as GH_TOKEN into each seated agent's pane and the
# Orchestrator's, for marking ready, merging and comments. Unset: gh's own login.
# read_token_cmd = "~/.config/acme/gh-watch-token.sh"
# write_token_cmd = "~/.config/acme/gh-app-token.sh"

# Deploy gate (needs [github]): after a PR merges, the agent is prompted to validate only once this command
# exits 0. It gets HERDR_ORCH_MERGE_SHA, HERDR_ORCH_TOPIC, HERDR_ORCH_REPO_ROOT and
# HERDR_ORCH_BRANCH; ~ is expanded. Empty (the default): no gate. For this plugin's own repo:
# deploy_check = ["~/.local/bin/herdr-orch", "deployed"]

# What "validated" means for this Topic: a live check (a command or short instructions) sent to the
# agent in its deploy prompt; the agent reports its output as --evidence to `herdr-orch validated`.
# validate = "Check the installed plugin runs the change."

# Minutes before an unanswered Topic is Unattended, and before a silent agent is reported.
# heartbeat_window_min = 15
# stale_min = 40
# hung_min = 60
# Minutes a branch may hold a ledger state before the watchdog raises a stuck Event (and nudges its agent;
# after a second limit it becomes an Attention follow-up). Defaults: ci 20, review 60, conflict 15, deploy 15,
# validate 10, agent 10; merge and human have none.
